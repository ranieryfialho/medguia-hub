name: Deploy Medguia Hub para VPS

on:
  push:
    branches: [ "main", "master" ]
    # O build roda DENTRO da VPS, na mesma máquina que hospeda o Supabase, e o
    # limite de memória do docker-compose não vale para `docker compose build`.
    # Cada deploy é, portanto, um risco real de derrubar o banco — foi o que
    # quase aconteceu em 11/08/2026. Não gastar esse risco com arquivo que o
    # Next.js nem lê: em 12/08, três dos cinco deploys do dia foram para mudar
    # spec, migration e documentação.
    #
    # `database/` entra aqui porque as migrations são aplicadas à mão no SQL
    # Editor do Studio, nunca pelo deploy.
    paths-ignore:
      - '.spec/**'
      - 'docs/**'
      - 'database/**'
      - '**.md'
  # Escape hatch: com o paths-ignore acima, mudar só documentação deixa de
  # publicar. Quando for preciso republicar sem alterar código, dispare à mão
  # pela aba Actions.
  workflow_dispatch:

# Duas execuções simultâneas brigam por três recursos: a memória da VPS, o mesmo
# diretório de destino do SCP e o `docker compose up`. O terceiro é o pior —
# sem ordem garantida, a run MAIS ANTIGA pode terminar por último e deixar a VPS
# no commit anterior, em silêncio. Aconteceu em 12/08/2026.
concurrency:
  group: deploy-vps
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Copiar arquivos para a VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: ".,!.git,!.github,!.next,!node_modules"
          target: "~/medguia-hub"
          timeout: 60s
          command_timeout: 10m

      - name: Construir e Ligar o Docker
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 30m
          script: |
            set -e
            cd ~/medguia-hub
            docker compose build
            docker compose up -d --remove-orphans
            docker image prune -f
            docker compose ps --filter "status=running" | grep medguia-hub