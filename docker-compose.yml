services:
  medguia-hub:
    image: ghcr.io/ranieryfialho/medguia-hub:latest
    container_name: medguia-hub
    ports:
      - "3000:3000"
    env_file:
      - .env
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 3000m
    networks:
      - wp-network

networks:
  wp-network:
    external: true
